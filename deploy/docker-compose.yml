services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lazycake
      POSTGRES_PASSWORD: lazycake
      POSTGRES_DB: lazycake
    ports:
      - "5432:5432"
    volumes:
      - lazycake-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycake"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    working_dir: /src
    command: ["go", "run", "github.com/pressly/goose/v3/cmd/goose@v3.28.0", "-dir", "migrations", "postgres", "postgres://lazycake:lazycake@postgres:5432/lazycake?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: coordinator
    environment:
      LAZYCAKE_DEV: "1"
      LAZYCAKE_DATABASE_URL: postgres://lazycake:lazycake@postgres:5432/lazycake?sslmode=disable
      LAZYCAKE_GRPC_ADDR: ":7443"
      LAZYCAKE_RELAY_ADDR: ":7444"
      LAZYCAKE_HTTP_ADDR: ":8080"
      LAZYCAKE_SEED_DEMO_TOKEN: "demo-customer-token"
      # host:port an agent should actually dial - shown verbatim in the
      # provider portal's "add a machine" install snippet (task 7.5).
      # Override for your own deployment; this default is only correct
      # for this specific demo VM.
      LAZYCAKE_PUBLIC_GRPC_ADDR: "${LAZYCAKE_PUBLIC_GRPC_ADDR:-localhost:7443}"
    ports:
      - "7443:7443"
      - "7444:7444/udp"
      - "8080:8080" # dashboard + SSE (tasks 6.1/6.2), http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # customer-db stands in for "the server holding the customer's data" -
  # the thing a gateway proves control of by being installed next to it
  # (PLAN.md overview). It is never reachable from the internet or from
  # any agent directly; only through gateway -> relay -> Noise.
  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme"]
      interval: 5s
      timeout: 5s
      retries: 10

  # gateway is installed "on the server holding customer data" per PLAN.md;
  # here that's just this container, next to customer-db. It registers
  # itself with the coordinator on first start (deploy/gateway-entrypoint.sh)
  # using the seeded demo customer token, the same one-time step
  # `lcctl gateway create` does by hand in a real deployment (task 2.7).
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    working_dir: /src
    entrypoint: ["sh", "deploy/gateway-entrypoint.sh"]
    environment:
      CUSTOMER_API_ADDR: coordinator:7443
      RELAY_ADDR: coordinator:7444
      CUSTOMER_TOKEN: "demo-customer-token"
      GATEWAY_LABEL: "customer-db"
      # REGISTER_SERVICES is what gets recorded with the coordinator
      # (name:port, informational). GATEWAY_SERVICES is what the gateway
      # process actually binds to locally, which needs an explicit host
      # here since the gateway and customer-db are necessarily separate
      # containers in this demo - a real deployment's gateway runs on the
      # same machine as the database it fronts, where the default
      # 127.0.0.1 (internal/gateway/config.Service) is correct as-is.
      REGISTER_SERVICES: "db:5432"
      GATEWAY_SERVICES: "db:customer-db:5432"
    volumes:
      - lazycake-gateway-state:/var/lib/lazycake-gateway
    depends_on:
      coordinator:
        condition: service_started
      customer-db:
        condition: service_healthy

  agent1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent
    environment:
      LAZYCAKE_DEV: "1"
      LAZYCAKE_COORDINATOR_ADDR: coordinator:7443
      LAZYCAKE_TOKEN: "demo-customer-token-agent"
      LAZYCAKE_OFFER_CORES: "2"
      LAZYCAKE_OFFER_MEMORY_MB: "2048"
      LAZYCAKE_OFFER_DISK_MB: "8192"
      XDG_RUNTIME_DIR: /run/lazycake-engine
      CONTAINER_HOST: unix:///run/lazycake-engine/podman/podman.sock
      # The agent talks to the *host's* engine over the socket below as a
      # sibling, not a child - any HostPath it bind-mounts into a task
      # container (internal/agent/exec/executor.go's lcinit mount) is
      # resolved by that host engine against the real host filesystem, not
      # this container's own. cmd/agent/run.go's discoverLcinit default
      # (next to the agent binary, inside this image) is therefore wrong
      # here; point this at a real path on the VM host holding a built
      # cmd/lcinit binary instead.
      LAZYCAKE_LCINIT_PATH: ${LAZYCAKE_LCINIT_PATH:?set to a host filesystem path (not a path inside this container) holding a built cmd/lcinit binary, e.g. $(pwd)/bin/lcinit}
    volumes:
      - ${LAZYCAKE_PODMAN_SOCKET:-/run/podman/podman.sock}:/run/lazycake-engine/podman/podman.sock
    depends_on:
      - coordinator

  agent2:
    extends:
      service: agent1

  agent3:
    extends:
      service: agent1

volumes:
  lazycake-postgres:
  lazycake-gateway-state:
