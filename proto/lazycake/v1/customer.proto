syntax = "proto3";
package lazycake.v1;
option go_package = "github.com/mkassab215/lazycake/internal/proto/lazycakev1";

// CustomerService is what lcctl talks to: submit tasks, check status, read
// logs, list nodes. Authenticated with a customer bearer token, the same
// way an agent authenticates with an agent token on AgentService.
service CustomerService {
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc GetTask(GetTaskRequest) returns (TaskStatus);
  // CancelTask stops a task at the customer's request: a queued task is cancelled at once and
  // costs nothing; a running one is told to stop and finishes shortly after (the returned
  // status has cancel_requested set until then), charging only the time it ran. Stopping a
  // task that was already stopped succeeds; stopping one that finished is FAILED_PRECONDITION.
  rpc CancelTask(CancelTaskRequest) returns (TaskStatus);
  rpc StreamLogs(StreamLogsRequest) returns (stream TaskLogLine);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc CreateGateway(CreateGatewayRequest) returns (CreateGatewayResponse);
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
}

message TaskLimits {
  double cpu_cores = 1;
  int32 memory_mb  = 2;
  int32 disk_mb    = 3;
  int32 tmpfs_mb   = 4;
  int32 pids       = 5;
  int32 wall_timeout_s = 6;
  int32 no_output_timeout_s = 7;
  int32 egress_mb  = 8;
}

// TunnelTargetSpec is one hostname the task's container will be allowed to
// resolve and connect to, reached through gateway_id. hostname is exactly
// what customer code connects to (e.g. "db.acme.com"); the coordinator
// resolves gateway_id to that gateway's published Noise key before
// dispatch, and internal/agent/netns's stub resolver only ever answers
// for hostnames listed here.
message TunnelTargetSpec {
  string gateway_id = 1;
  string hostname    = 2;
  int32  port        = 3;
}

message SubmitTaskRequest {
  string image         = 1;   // must be digest-pinned: "repo@sha256:..."
  repeated string entrypoint = 2;
  repeated string args  = 3;
  map<string,string> env = 4;
  string workdir        = 5;
  TaskLimits limits      = 6;
  string idempotency_key = 7;
  repeated TunnelTargetSpec targets = 8; // at most 3 - PLAN.md overview
  string delivery        = 9;  // "at_most_once" (default) | "at_least_once"
}

message SubmitTaskResponse {
  string task_id = 1;
}

message GetTaskRequest {
  string task_id = 1;
}

message TaskStatus {
  string task_id     = 1;
  string state       = 2;
  int32  exit_code    = 3;
  bool   has_exit_code = 4;
  string exit_reason  = 5;
  string node_id      = 6;
  int64  created_at_unix_ms  = 7;
  int64  started_at_unix_ms  = 8;
  int64  finished_at_unix_ms = 9;
  // True once a stop was requested but the task has not finished yet.
  bool   cancel_requested    = 10;
}

message CancelTaskRequest {
  string task_id = 1;
}

message StreamLogsRequest {
  string task_id = 1;
  bool   follow  = 2;
}

message TaskLogLine {
  int64  seq    = 1;
  string stream = 2;
  int64  at_unix_ms = 3;
  string line   = 4;
}

message ListNodesRequest {}

message NodeStatus {
  string node_id      = 1;
  string hostname      = 2;
  bool   connected     = 3;
  double offer_cores   = 4;
  int32  offer_memory_mb = 5;
  int32  offer_disk_mb   = 6;
  double trust_score   = 7;
}

message ListNodesResponse {
  repeated NodeStatus nodes = 1;
}

message CreateGatewayRequest {
  string label = 1;
  // service_name:port, repeatable, e.g. "db:5432".
  repeated string services = 2;
}

message CreateGatewayResponse {
  string gateway_id = 1;
  // install_token authenticates the gateway process itself
  // (LAZYCAKE_TOKEN) - shown once, not retrievable again.
  string install_token = 2;
}

message ListGatewaysRequest {}

message GatewayStatus {
  string gateway_id = 1;
  string label      = 2;
  bool   connected  = 3;
  repeated string services = 4;
}

message ListGatewaysResponse {
  repeated GatewayStatus gateways = 1;
}
