syntax = "proto3";
package lazycake.v1;
option go_package = "github.com/mkassab215/lazycake/internal/proto/lazycakev1";

// GatewayService lets a gateway report the byte counts it observed
// forwarding one task's traffic - the third independent measurement point
// IMPLEMENTATION.md task 4.3's byte reconciliation needs, alongside the
// agent's own TaskFinished report and the relay's stream counters.
// Authenticated with the gateway's own bearer token (store.TokenGateway),
// the same one it already uses to connect to the relay.
service GatewayService {
  rpc ReportBytes(ByteReport) returns (ByteReportAck);
}

// ByteReport carries the bytes one forwarded connection moved since its previous report
// (a delta, not a running total), so a connection that stays open for hours shows up over
// time instead of as one spike when it finally closes, and the deltas of one connection sum
// to what a single report at close used to carry. A gateway built before these fields sends
// one report at close with service unset and final unset; the coordinator treats that as the
// whole connection.
message ByteReport {
  string gateway_id     = 1;
  string task_id        = 2;
  int64  bytes_to_local = 3; // gateway -> local service
  int64  bytes_to_task  = 4; // local service -> gateway -> task
  string service        = 5; // which published service the connection used
  bool   final          = 6; // the connection has closed; this is its last report
  // How many connections closed since the previous report, when the gateway batches many into one. A report
  // with final set and this left at 0 (a gateway built before batching) counts as one.
  int32  connections    = 7;
}

message ByteReportAck {}
